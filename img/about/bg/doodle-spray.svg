<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <!-- An original hand-drawn doodle spray for the About page's paper set:
       white five-petal flowers with a fine ink line and pink centres, mint
       leaves, one trumpet lily (hoa hue) and a scatter of white dots. -->
  <defs>
    <g id="petal">
      <path d="M0 0 C -7 -6 -8 -19 0 -25 C 8 -19 7 -6 0 0 Z" fill="#fff" stroke="#2a2440" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <g id="flower">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle r="6" fill="#f48fb8" stroke="#2a2440" stroke-width="1.2"/>
      <circle r="2.2" fill="#d6477d"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C 8 -8 22 -8 30 0 C 22 8 8 8 0 0 Z" fill="#8fe0c0" stroke="#2a2440" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M3 0 C 12 -1.5 20 -1.5 27 0" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- stems -->
  <path d="M74 150 C 88 128 104 112 128 98" fill="none" stroke="#2a2440" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M104 122 C 120 132 140 140 168 138" fill="none" stroke="#2a2440" stroke-width="1.2" stroke-linecap="round"/>

  <!-- leaves -->
  <use href="#leaf" transform="translate(86 132) rotate(-60) scale(.9)"/>
  <use href="#leaf" transform="translate(110 112) rotate(-8)"/>
  <use href="#leaf" transform="translate(140 138) rotate(26) scale(.85)"/>
  <use href="#leaf" transform="translate(60 88) rotate(200) scale(.75)"/>

  <!-- the lily: a trumpet of six pointed tepals, drawn in one line -->
  <g transform="translate(176 132) rotate(-28)">
    <path d="M0 0 C -4 -10 -12 -18 -20 -30 C -10 -26 -4 -22 0 -16 C 4 -22 10 -26 20 -30 C 12 -18 4 -10 0 0 Z" fill="#fff" stroke="#2a2440" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M0 -16 C -3 -26 -2 -34 0 -40 C 2 -34 3 -26 0 -16 Z" fill="#fff" stroke="#2a2440" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M0 -6 L -5 -34 M0 -6 L 5 -34 M0 -6 L 0 -38" stroke="#d6477d" stroke-width=".9" stroke-linecap="round"/>
    <circle cx="-5" cy="-35" r="1.8" fill="#d6477d"/><circle cx="5" cy="-35" r="1.8" fill="#d6477d"/><circle cx="0" cy="-39" r="1.8" fill="#d6477d"/>
  </g>

  <!-- flowers -->
  <use href="#flower" transform="translate(128 96) scale(1.15) rotate(8)"/>
  <use href="#flower" transform="translate(62 70) scale(.82) rotate(-14)"/>
  <use href="#flower" transform="translate(96 150) scale(.62) rotate(30)"/>
  <use href="#flower" transform="translate(40 128) scale(.5) rotate(4)"/>

  <!-- dots -->
  <g fill="#fff">
    <circle cx="30" cy="40" r="2.4"/><circle cx="52" cy="26" r="1.6"/><circle cx="92" cy="44" r="2"/>
    <circle cx="160" cy="70" r="2.4"/><circle cx="182" cy="92" r="1.5"/><circle cx="198" cy="64" r="2"/>
    <circle cx="20" cy="96" r="1.7"/><circle cx="24" cy="160" r="2.2"/><circle cx="58" cy="176" r="1.5"/>
    <circle cx="132" cy="170" r="2.3"/><circle cx="206" cy="150" r="1.6"/><circle cx="220" cy="118" r="2.2"/>
    <circle cx="112" cy="20" r="1.5"/><circle cx="150" cy="40" r="1.8"/>
  </g>
</svg>
